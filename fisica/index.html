<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Aperte "n" para criar uma nova bola!</p>
    <div class="simulator">
        <div class="sliders">
            <label for="gravity">Gravidade <output id="gravity-value">0</output></label>
            <input id="gravity" type="range" min="-0.5" max="0.5" step="0.01" value="0">

            <label for="bounce">Quicadura <output id="bounce-value">0.80</output></label>
            <input id="bounce" type="range" min="0" max="1" step="0.01" value="0.80">

            <label for="radius">Tamanhos: <output id="radius-value">30</output></label>
            <input id="radius" type="range" min="1" max="60" step="1" value="30">
        </div>
        <canvas width="800" height="800" id="draw"></canvas>
    </div>

    <script src="main.js"></script>
</body>
</html>
